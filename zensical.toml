[project]
site_name = "VinTest"
site_url = "https://artalus.github.io/vintest/"
site_description = "In-game testing framework for Vintage Story mods"
docs_dir = "docs"
repo_url = "https://github.com/Artalus/vintest"
repo_name = "Artalus/vintest"
nav = [
    { Home = "index.md" },
    { Guides = [
        "guides/index.md",
        { Quickstart = [
            "quickstart/getting-started.md",
            "quickstart/cake-integration.md",
            "quickstart/vscode-extension.md",
        ] },
        "guides/writing-tests.md",
        "guides/cake-ref.md",
        "guides/vscode-ref.md",
        "guides/local-dev.md",
    ] },
    { "API Reference" = [
        "api/index.md",
        { VinTest = [
            "api/VinTest.md",
            "api/VinTest.TestChain.md",
            "api/VinTest.TestStep.md",
            "api/VinTest.GameTestAttribute.md",
            "api/VinTest.GametestModsystemBase.md",
            "api/VinTest.GameTestSuiteAttribute.md",
        ] },
        { "VinTest.Cake" = [
            "api/VinTest.Cake.md",
            "api/VinTest.Cake.ContextBase.md",
            "api/VinTest.Cake.GameTestsTaskBase_TContext_.md",
        ] },
    ] },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
variant = "classic"

features = [
    # https://zensical.org/docs/setup/navigation/#navigation-tabs
    "navigation.tabs",
    # https://zensical.org/docs/authoring/code-blocks/#code-annotations
    "content.code.annotate",
    # https://zensical.org/docs/authoring/code-blocks/#code-copy-button
    "content.code.copy",
    # https://zensical.org/docs/authoring/footnotes/#footnote-tooltips
    "content.footnote.tooltips",
    # https://zensical.org/docs/setup/footer/#navigation
    "navigation.footer",
    # https://zensical.org/docs/setup/navigation/#section-index-pages
    "navigation.indexes",
    # https://zensical.org/docs/setup/navigation/#instant-navigation
    "navigation.instant",
    # https://zensical.org/docs/setup/navigation/#instant-prefetching
    "navigation.instant.prefetch",
    # https://zensical.org/docs/setup/navigation/#navigation-path
    "navigation.path",
    # https://zensical.org/docs/setup/navigation/#navigation-sections
    "navigation.sections",
    # https://zensical.org/docs/setup/navigation/#back-to-top-button
    "navigation.top",
    # https://zensical.org/docs/setup/search/#search-highlighting
    "search.highlight",
    # https://zensical.org/docs/setup/navigation/#navigation-integration
    # "toc.integrate",
]

[project.theme.icon]
# - https://zensical.org/docs/setup/logo-and-icons
# - https://github.com/zensical/ui/tree/master/dist/.icons
logo = "material/tree-outline"


# https://zensical.org/docs/setup/colors/

[[project.theme.palette]]
scheme = "slate"
primary = "green"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
[[project.theme.palette]]
scheme = "default"
primary = "green"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# https://zensical.org/docs/setup/extensions/
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
# https://zensical.org/docs/authoring/images/
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.blocks.caption]
# + https://zensical.org/docs/setup/extensions/glightbox/
[project.markdown_extensions.zensical.extensions.glightbox]
# https://zensical.org/docs/setup/extensions/python-markdown-extensions/#details
[project.markdown_extensions.pymdownx.details]
